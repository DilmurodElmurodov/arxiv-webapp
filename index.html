<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Milliy Arxiv — Rasmiy Ariza Formasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --primary-color: #0ea5e9;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header .icon { font-size: 40px; margin-bottom: 6px; }
        .header h1 { font-size: 19px; font-weight: 700; color: var(--text-color); }
        .header p { font-size: 12px; color: var(--subtext-color); margin-top: 2px; }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary-color);
            margin: 18px 0 8px 0;
            font-weight: 600;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: linear-gradient(135deg, var(--primary-color), #0284c7);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Galochka (Success Overlay) Uslubi */
        .success-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 99;
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .checkmark-circle {
            width: 75px;
            height: 75px;
            background: var(--success-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .checkmark-circle svg {
            width: 42px;
            height: 42px;
            fill: none;
            stroke: #fff;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .success-title {
            font-size: 18px;
            font-weight: 700;
            margin-top: 16px;
            color: #fff;
        }

        .success-sub {
            font-size: 13px;
            color: var(--subtext-color);
            margin-top: 6px;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Success Overlay (Galochka) -->
    <div class="success-overlay" id="successOverlay">
        <div class="checkmark-circle">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <div class="success-title">Ariza Qabul Qilindi!</div>
        <div class="success-sub">Ma'lumotlar saqlanmoqda...</div>
    </div>

    <div class="header">
        <div class="icon">🏛️</div>
        <h1>Milliy Arxiv Axborot</h1>
        <p>Elektron ariza topshirish oynasi</p>
    </div>

    <form id="arizaForm">
        <div class="section-title">1. Tashkilot Ma'lumotlari</div>
        <div class="form-group">
            <label>Tashkilot nomi *</label>
            <div class="input-wrapper"><input type="text" id="tashkilotNomi" placeholder="MCHJ 'Nur-Tekstil'" required></div>
        </div>
        <div class="form-group">
            <label>STIR (9 ta raqam) *</label>
            <div class="input-wrapper"><input type="text" id="stirRaqami" maxlength="9" placeholder="123456789" required></div>
        </div>
        <div class="form-group">
            <label>Telefon raqam *</label>
            <div class="input-wrapper"><input type="tel" id="telefonRaqami" value="+998" required></div>
        </div>
        <div class="form-group">
            <label>Foydalanuvchilar soni *</label>
            <div class="input-wrapper"><input type="number" id="foydalanuvchilarSoni" placeholder="5" required></div>
        </div>

        <div class="section-title">2. Rahbar Ma'lumotlari</div>
        <div class="form-group">
            <label>Rahbar F.I.O. *</label>
            <div class="input-wrapper"><input type="text" id="rahbarFio" placeholder="Ism Familiya" required></div>
        </div>
        <div class="form-group">
            <label>Rahbar lavozimi *</label>
            <div class="input-wrapper"><input type="text" id="rahbarLavozimi" placeholder="Rektor" required></div>
        </div>
        <div class="form-group">
            <label>Rahbar JSHSHIR (14 ta raqam) *</label>
            <div class="input-wrapper"><input type="text" id="rahbarJshshir" maxlength="14" required></div>
        </div>

        <div class="section-title">3. Mas'ul Xodim Ma'lumotlari</div>
        <div class="form-group">
            <label>Mas'ul xodim F.I.O. *</label>
            <div class="input-wrapper"><input type="text" id="masulFio" placeholder="Ism Familiya" required></div>
        </div>
        <div class="form-group">
            <label>Mas'ul xodim lavozimi *</label>
            <div class="input-wrapper"><input type="text" id="masulLavozimi" placeholder="Arxivchi" required></div>
        </div>
        <div class="form-group">
            <label>Mas'ul xodim JSHSHIR (14 ta raqam) *</label>
            <div class="input-wrapper"><input type="text" id="masulJshshir" maxlength="14" required></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Arizani Yuborish 🚀</button>
    </form>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const form = document.getElementById('arizaForm');
    const successOverlay = document.getElementById('successOverlay');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // 1. Ma'lumotlarni JSON shakliga keltirish
        const payload = {
            tashkilotNomi: document.getElementById('tashkilotNomi').value,
            stirRaqami: document.getElementById('stirRaqami').value,
            telefonRaqami: document.getElementById('telefonRaqami').value,
            foydalanuvchilarSoni: document.getElementById('foydalanuvchilarSoni').value,
            rahbarFio: document.getElementById('rahbarFio').value,
            rahbarLavozimi: document.getElementById('rahbarLavozimi').value,
            rahbarJshshir: document.getElementById('rahbarJshshir').value,
            masulFio: document.getElementById('masulFio').value,
            masulLavozimi: document.getElementById('masulLavozimi').value,
            masulJshshir: document.getElementById('masulJshshir').value
        };

        // 2. Darhol Yashil Galochka Animatsiyasini yoqish
        successOverlay.classList.add('active');

        // 3. Vibratsiya berish
        if (tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
        }

        // 4. 1.5 soniyadan so'ng ma'lumotni Telegram botga uzatish va oynani yopish
        setTimeout(() => {
            tg.sendData(JSON.stringify(payload));
        }, 1500);
    });
</script>
</body>
</html>
